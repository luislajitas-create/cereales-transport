name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm install

      # DEV-1 — corre justo después de instalar las dependencias del backend (las pruebas
      # spawnean procesos node reales que necesitan backend/node_modules/dotenv presente) y
      # antes de migrate/seed/build/test: es rápida, no depende de la base migrada ni del
      # build, así que si algo del contrato de carga de entorno está roto, falla temprano sin
      # esperar el resto del job. Se ejecuta desde la raíz del repo (no "backend", que es el
      # working-directory por defecto de este job) porque scripts/tests/dev1.test.js vive ahí
      # — no reinstala nada, reutiliza el npm install de arriba.
      - name: Pruebas DEV-1 (entorno local)
        working-directory: ${{ github.workspace }}
        run: npm run test:dev1

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npx prisma db seed

      - run: npm run build

      - run: npm run test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      # DEV-1 — antes de este bloque, CI no verificaba el frontend en absoluto. `npm run build`
      # ya corre `tsc -b && vite build` (typecheck + build en un solo paso, mismo comando que
      # se usa en desarrollo local) — cubre exactamente vite.config.ts, tocado por DEV-1
      # (strictPort), sin agregar un paso de typecheck separado y redundante.
      - run: npm run build
